name: Add DMG to existing release
on:
  push:
    tags: ['dmg-v*', 'asset-names-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.0
permissions:
  contents: write
concurrency:
  group: release-dmg-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    if: ${{ !startsWith(github.ref_name, 'asset-names-') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify published Mac applications
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p build/bin
          gh release download "${RELEASE_TAG#dmg-}" --pattern 'wails-ssh-macos-*.zip' --pattern SHA256SUMS.txt --dir build/bin
          cd build/bin
          for archive in wails-ssh-macos-*.zip; do
            awk -v file="$archive" '$2 == file {print; found=1} END {if (!found) exit 1}' SHA256SUMS.txt | shasum -a 256 -c -
          done
      - name: Create and verify DMG images
        run: |
          for variant in Apple-M-series Intel; do
            ditto -x -k "build/bin/wails-ssh-macos-$variant.zip" "build/bin/$variant"
            bash scripts/package-macos.sh "build/bin/$variant/wails-ssh.app" "build/bin/wails-ssh-macos-$variant.dmg"
          done
          cd build/bin
          awk '$2 !~ /\.dmg$/' SHA256SUMS.txt > SHA256SUMS.updated.txt
          shasum -a 256 *.dmg >> SHA256SUMS.updated.txt
          mv SHA256SUMS.updated.txt SHA256SUMS.txt
      - name: Add DMG downloads to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "${RELEASE_TAG#dmg-}" --clobber build/bin/SHA256SUMS.txt \
            'build/bin/wails-ssh-macos-Apple-M-series.dmg#macOS 苹果 M 系列芯片 · DMG 安装包' \
            'build/bin/wails-ssh-macos-Intel.dmg#macOS Intel 芯片 · DMG 安装包'
          gh release edit "${RELEASE_TAG#dmg-}" --notes-file docs/release-notes.md
  rename:
    if: startsWith(github.ref_name, 'asset-names-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Clarify Mac download names and labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/rename-macos-release.py
