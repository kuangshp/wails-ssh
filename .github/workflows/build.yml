name: Build desktop applications
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin/arm64
            artifact: wails-ssh-macos-arm64
          - os: macos-15-intel
            platform: darwin/amd64
            artifact: wails-ssh-macos-amd64
          - os: windows-2022
            platform: windows/amd64
            artifact: wails-ssh-windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: npm run build
      - name: Test backend
        run: go test ./...
      - name: Vet backend
        run: go vet ./...
      - name: Build Wails application
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -platform ${{ matrix.platform }}
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/wails-ssh.app build/bin/${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*.zip
            build/bin/*.exe
          if-no-files-found: error
