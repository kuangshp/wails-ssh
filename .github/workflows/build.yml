name: Build desktop applications
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin/arm64
            artifact: wails-ssh-macos-arm64
          - os: macos-15-intel
            platform: darwin/amd64
            artifact: wails-ssh-macos-amd64
          - os: windows-2022
            platform: windows/amd64
            artifact: wails-ssh-windows-amd64
            build-flags: -nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'const c = require("./wails.json"); if (process.env.GITHUB_REF_NAME !== `v${c.info.productVersion}`) throw new Error("Tag must match wails.json productVersion")'
      - name: Run shared quality checks
        run: node scripts/check.mjs
      - name: Install Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Wails application
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -platform ${{ matrix.platform }} ${{ matrix.build-flags }}
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item build/bin/wails-ssh-amd64-installer.exe build/bin/${{ matrix.artifact }}-setup.exe
          Compress-Archive -Path build/bin/wails-ssh.exe -DestinationPath build/bin/${{ matrix.artifact }}-portable.zip
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/bin/wails-ssh.app build/bin/${{ matrix.artifact }}.zip
          bash scripts/package-macos.sh build/bin/wails-ssh.app 'build/bin/${{ matrix.artifact }}.dmg'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*.zip
            build/bin/*.dmg
            build/bin/*-setup.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wails-ssh-*
          merge-multiple: true
          path: release
      - name: Create checksums
        working-directory: release
        run: sha256sum *.zip *.exe *.dmg > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "云桥 $RELEASE_TAG" --notes-file docs/release-notes.md
